name: Release draft

# every merge into main that raised the version gets a draft release, written
# from its pull request. A draft: a person reads the notes before publishing
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# two merges in a row must not both decide the same version has no draft yet
concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    name: draft the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # the tags, to link the comparison with the previous version
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: uv run --no-project python tools/release_draft.py
