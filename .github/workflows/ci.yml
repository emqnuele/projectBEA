name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# a second push supersedes the first: the older run is cancelled rather than
# left to finish against code nobody is looking at any more
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # she is installed on all three, so she is tested on all three. A date
    # format that only windows rejects took her voice away on windows alone,
    # and a green ubuntu run said nothing about it.
    name: lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails when uv.lock has drifted from pyproject.toml, which is a
      # real defect and not something to paper over on the runner
      - name: Install dependencies
        run: uv sync --locked

      # lint and types read the code, not the machine: one platform is the
      # whole answer, and three runs of it would be three of the same one
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check src tests

      # src only, and only because it is at zero: tests pass fakes and
      # deliberately wrong values on purpose, so checking them fights the point
      # of the fakes. Added once it already passed — a gate that is red on the
      # day it lands is a gate people learn to ignore.
      - name: Types
        if: matrix.os == 'ubuntu-latest'
        run: uvx pyright

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: browser source tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # deliberately no `npm ci`: what is tested here is pure — a spectrum in,
      # a decision out — so it needs neither three.js nor react to run
      - name: Tests
        working-directory: src/web/frontend
        run: npm test

  bot:
    name: discord bot tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # the bot's own tests need express and discord.js, nothing else
      - name: Install dependencies
        working-directory: src/core/skills/voice/bot
        run: npm ci --omit=dev

      - name: Tests
        working-directory: src/core/skills/voice/bot
        run: npm test
