name: CI

on:
  workflow_dispatch:
  # edge can change under us, and the streaming it is relied on for cannot be
  # checked without the real service, so it is asked nightly rather than on
  # every push where a provider hiccup would read as a broken branch
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

# a second push supersedes the first: the older run is cancelled rather than
# left to finish against code nobody is looking at any more
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # she is installed on all three, so she is tested on all three. A date
    # format that only windows rejects took her voice away on windows alone,
    # and a green ubuntu run said nothing about it.
    name: lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails when uv.lock has drifted from pyproject.toml, which is a
      # real defect and not something to paper over on the runner
      - name: Install dependencies
        run: uv sync --locked

      # lint and types read the code, not the machine: one platform is the
      # whole answer, and three runs of it would be three of the same one
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check src tests

      # src only, and only because it is at zero: tests pass fakes and
      # deliberately wrong values on purpose, so checking them fights the point
      # of the fakes. Added once it already passed — a gate that is red on the
      # day it lands is a gate people learn to ignore.
      - name: Types
        if: matrix.os == 'ubuntu-latest'
        run: uvx pyright

      - name: Tests
        run: uv run pytest -q

  no-perf:
    # the kill switch must keep working: the old paths it restores are only
    # exercised when something actually runs with it set
    name: tests with BEA_PERF=off (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q
        env:
          BEA_PERF: off

  frontend:
    name: browser source tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # deliberately no `npm ci`: what is tested here is pure — a spectrum in,
      # a decision out — so it needs neither three.js nor react to run
      - name: Tests
        working-directory: src/web/frontend
        run: npm test

  bot:
    name: discord bot tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # the bot's own tests need express and discord.js, nothing else
      - name: Install dependencies
        working-directory: src/core/skills/voice/bot
        run: npm ci --omit=dev

      - name: Tests
        working-directory: src/core/skills/voice/bot
        run: npm test

  voice-e2e:
    # the brain's half and the bot's half only meet here: the real socket, the
    # real VoiceManager and a real AudioPlayer, with no discord. The python job
    # has no node_modules and the bot job has no python, so this needs its own.
    name: voice call end to end (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --locked

      # the e2e test skips itself without the bot's node_modules, which is
      # exactly what "it never ran in ci" used to look like
      - name: Install the bot
        working-directory: src/core/skills/voice/bot
        run: npm ci --omit=dev

      - name: Tests
        run: uv run pytest -q tests/test_voice_call_e2e.py

  edge-prefix:
    # the invariant that lets a sentence be streamed a stretch at a time, asked
    # of the real service. A new voice format or a libsndfile bump is exactly
    # what this catches, and neither is visible from a synthetic clip
    name: edge still streams as prefixes (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check
        run: uv run python tools/edge_prefix_check.py
