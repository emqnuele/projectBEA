<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="SHURA Command Center — a persistent creative and technical intelligence." />
  <meta name="theme-color" content="#0a0a12" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <title>SHURA // Command Center</title>
  <script>
    // theme before first paint, so the shell never flashes the wrong ground
    try {
      const saved = JSON.parse(localStorage.getItem('bea.appearance') || '{}');
      if (saved.theme) document.documentElement.dataset.theme = saved.theme;
    } catch (e) { /* a corrupt preference is not worth a broken boot */ }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
