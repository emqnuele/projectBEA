[project]
name = "projectbea"
version = "2.0.0"
description = "ProjectBEA - AI Vtuber Engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "edge-tts",
    "sounddevice",
    "soundfile",
    "numpy<2.0.0",
    "obsws-python",
    "openai",
    "rich",
    "fastapi",
    "uvicorn",
    # the bot's voice push channel is a websocket; uvicorn needs this to serve it
    "websockets",
    "python-multipart",
    "requests",
    "python-dotenv",
    "websocket-client",
    "kokoro-onnx",
    "faster-whisper>=1.1",
    "groq",
    "fastembed>=0.3,<0.9",
    "sqlite-vec>=0.1.1",
    "python-telegram-bot[job-queue]>=21",
]

[project.scripts]
bea = "src.cli:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# deliberately no "UP": modernizing typing across ~6k lines is a separate
# refactor, and a gate that fails on day one is a gate nobody runs
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E741", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
