[project]
name = "projectbea"
version = "0.1.0"
description = "ProjectBEA - AI Vtuber Engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-genai",
    "edge-tts",
    "sounddevice",
    "soundfile",
    "numpy<2.0.0",
    "obsws-python",
    "openai",
    "rich",
    "transformers<4.42",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "requests",
    "python-dotenv",
    "websocket-client",
    "colorama",
    "tenacity",
    "kokoro-onnx",
    "groq",
    "pydantic-settings",
    "fastembed>=0.3,<0.8",
    "sqlite-vec>=0.1.1",
    "python-telegram-bot[job-queue]>=21",
]

[project.scripts]
bea = "src.cli:run"

[project.optional-dependencies]
# extra deps for the standalone minecraft agent skill
minecraft = ["flask"]
# only needed once, to lift the old diary out of chroma into bea.db
migrate = ["chromadb>=0.4.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# deliberately no "UP": modernizing typing across ~6k lines is a separate
# refactor, and a gate that fails on day one is a gate nobody runs
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E741", "B008"]

[tool.ruff.lint.per-file-ignores]
# the cli must set env vars and load .env before importing anything heavy
"src/cli.py" = ["E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
